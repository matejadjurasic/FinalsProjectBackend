version: '3.8'

services:
  # Backend - Development overrides
  backend:
    build:
      target: development
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
       - .:/src
    command: dotnet watch run --project /src/FitnessPal.API/FitnessPal.API.csproj --no-launch-profile

  # Frontend - Development overrides  
  frontend:
    build:
      target: development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - CHOKIDAR_IGNORE=node_modules
      - WDS_SOCKET_PORT=0
    volumes:
      - ./fitnesspal-frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:3000"
    stdin_open: true
    tty: true
    command: npm start
